server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        resolver 10.96.0.10 valid=10s;
        set $backend "http://inpad-backend.inpad.svc.cluster.local:3000";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA-маршрутизация ---
    # react-router работает через History API. При прямом заходе или
    # перезагрузке на /objects/123 nginx не найдёт такого файла и
    # вернул бы 404. try_files отдаёт index.html, и роутинг
    # доигрывается уже на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты Vite содержат хеш в имени (index-ab12cd.js) — их можно
    # кешировать «навсегда»: при изменении меняется имя файла.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html кешировать нельзя — иначе клиент не увидит новый билд.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Сжатие текстовых ресурсов
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
